name: Build & deploy

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest run per branch matters; cancel anything mid-flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Set these as repository variables to switch sync on. Absent, the
          # app builds local-only and the sync code stays inert.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only main publishes. Feature branches and pull requests get the build and
    # tests, but must never overwrite the live site with in-progress work.
    #
    # Excludes pull_request rather than requiring push, so a run started by hand
    # from the Actions tab (workflow_dispatch) can publish too. Without that,
    # recovering from a failed deploy means inventing an empty commit, because
    # re-running a failed run keeps the original event.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
